<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Roller Coaster Incremental</title>
    <link href="planets.css" rel="stylesheet" type="text/css" />
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/break_infinity.js@2"></script>
    <script src="../main.js">loadGame()</script>
    <script src="planets.js"></script>
  </head>
  <body>
    <header>
      <div class="riderCount">
        <h2 id="riderText">You have 1 riders</h2>
        <!-- This shows the total amount of riders you have on your coaster. -->
        <h3 id="riderGainText">You are getting 0 riders per second</h3>
        <!-- This shows the amount of riders you gain per second. -->
      </div>
      <h2 id="planetText">You have 0 material points</h2>
      <!-- This shows how many material points you have. -->
    </header>

    <nav id="topButtons">
      <a href="../length-page/length.html"><button>length</button></a>
      <a href="../hills-page/hills.html"><button>hills</button></a>
      <a href="../inversions-page/inversions.html"><button>inversions</button></a>
      <a href="../theming-page/theming.html"><button>theming</button></a>
      <a href="../materials-page/materials.html"><button>materials</button></a>
      <a><button id="planetsButton">planets</button></a>
      <a href="../options-page/options.html"><button>options</button></a>
    </nav>
    <!-- These are the navigational buttons that take you to each page. -->

    
    <div id="planetBuyables">
      <button id="planet1" onClick="buyLengthBuyable1()">Press this to get 1 more space point<br>Requires: 1 rider<br>Bought: 0</button>
      <button id="planet2" onClick="buyLengthBuyable2()">Press this to get 2 more space points<br>Requires: 4 riders<br>Bought: 0</button>
      <button id="planet3" onClick="buyLengthBuyable3()">Press this to get 5 more space points<br>Requires: 10 riders<br>Bought: 0</button>
      <button id="planet4" onClick="buyLengthBuyable4()">Press this to get 10 more space points<br>Requires: 20 riders<br>Bought: 0</button>
      <button id="planet5" onClick="buyLengthBuyable4()">Press this to get 15 more space points<br>Requires: 20 riders<br>Bought: 0</button>
      <button id="planet6" onClick="buyLengthBuyable4()">Press this to get 20 more space points<br>Requires: 20 riders<br>Bought: 0</button>
    </div>
    <!-- These are buyables that you can purchase to help you in the game. -->

    <div id="lastUnlock">
      <button id="lastButton" onClick="buyLengthUpgrade()">Press here to unlock the final layer<br>Requires 250 space points</button>
    </div>

  </body>
</html>
