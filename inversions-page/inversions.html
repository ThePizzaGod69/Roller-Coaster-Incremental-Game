<!DOCTYPE html>
<html> 
  <head> 
    <meta charset='utf-8'> 
    <meta name='viewport' content='width=device-width'> 
    <title>Roller Coaster Incremental</title> 
    <link href='inversions.css' rel='stylesheet' type='text/css' /> 
    <script src='https://code.jquery.com/jquery-3.4.1.min.js'> </script>

  <body> 
    <header>
      <div class="riderCount">
        <h2 id="riderText">You have 0 riders</h2>
        <h3 id="riderGainText">You are getting 0 riders per second</h2>
          </div>
      <h2 id="inversionText">Your coaster has 0 inversions</h2>
      <!--Amount of total inversions.-->
    </header>
    <nav id="topButtons">
      <a href="../length-page/length.html"><button>length</button></a>
      <a href="../hills-page/hills.html"><button>hills</button></a>
      <a><button id="inversionsButton">inversions</button></a>
      <a id="themesNavButton" href="../theming-page/theming.html"><button>theming</button></a>
      <a href="../options-page/options.html"><button>options</button></a>
    </nav>
    <div id="inversionsReset">
    <button  id="inversionsResetButton" onclick="inversionsReset()">Reset all previous progress for
    0 inversions<br> next at 50 hills</button></div>
    <!--By resetting all previous progress you can gain an inversion which is the resource for this page.-->
    <div class="buyableBoxes">
      <button id="inversion1" onclick="buyInversionBuyable(5)">
    <!--Lets you boost hill gain-->
        <button id="inversion2" onclick="buyInversionBuyable(6)">
          <!--Lets you make a vertical loop a hill gain.-->
       </button>
      <button id="inversion3" onclick="buyInversionBuyable(7)">
        <!--Rider gain increase.-->
      <button id="inversion4" onclick="buyInversionBuyable(8)">
      </button>
      <button id="inversion5" onclick="buyInversionBuyable(9)">
      </button>
      <button id="inversion6" onclick="buyInversionBuyable(10)">
      </button>
      <!--These are buyables.-->
    </div>
    <div id="themesUnlock">
      <button id="themesButton" onclick="buyInversionUpgrade()">Press here to unlock the themes layer<br>Requires 30 Inversions</button>
    </div>
  </body> 
  <script src="../main.js"></script>
  <script src="inversions.js"></script>
