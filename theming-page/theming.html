<!DOCTYPE html>
<html> 
  <head> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width"> 
    <title>Roller Coaster Incremental</title> 
    <link href="theming.css" rel="stylesheet" type="text/css" /> 
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"> </script> 
    <script src="https://cdn.jsdelivr.net/npm/break_eternity.js@2"></script>
  </head> 
  <body> 
    <header>
        <div class="riderCount">
        <h2 id="riderText">You have 0 riders</h2>
        <h3 id="riderGainText">You are getting 0 riders per Second</h2>
      </div>
      <h2 id="themingText">You have 0 themes</h2>
      <h3 id="themingGainText">You are getting 0 theme points per second</h2>
      <br>
      <h3 id="themingPointText">You have 0 theme points</h2>
    </header>
    <nav id="topButtons">
      <a href="../length-page/length.html"><button>length</button></a>
      <a href="../hills-page/hills.html"><button>hills</button></a>
      <a href="../inversions-page/inversions.html"><button>inversions</button></a>
      <a><button id="themingButton">theming</button></a>
      <a href="../options-page/options.html"><button id="optionsButton">options</button></a>
    </nav>
    <div id="themeReset">
    <button id="themeResetButton" onclick="themesReset()">Get a theme<br>next at 30 inversions</button></div>
    <!--This allowes you to reset your points for a theme, which is the specific resource for the theming page.-->
    <div class="buyableBoxes">
      <button id="theme1" onclick="buyThemingBuyable(5)"></button>
        <!--This shows the requirements for a tree.-->
        <button id="theme2" onclick="buyThemingBuyable(6)">
        <!--By spending a certain amount of theming points allows you to gain riders by squaring it too the 1.03. Also a new sign for coaster.-->
       </button>
       <button id="theme3" onclick="buyThemingBuyable(7)">
      </button>
      <br>
      <button id="theme4" onclick="buyThemingBuyable(8)"></button>
        <!--You can buy a new paint job which also like the last one increases total amount of riders.-->
      <button id="theme5" onclick="buyThemingBuyable(9)">
      </button>
      <button id="theme6" onclick="buyThemingBuyable(10)">
      </button>
      <!--These are other buyables you can buy.-->
    </div>
    <div id="ending">
      <button id="endButton" onclick="buyEndUpgrade()">end the game<br>needs ee100 theme points</button>
    </div>
  </body> 
  <script src="../main.js"></script>
  <script src="theming.js"></script> 
</html>
